    <!-- Structured Data (Schema.org Course) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "Karmatix .NET Academy",
      "description": "Comprehensive, production-grade .NET 10 and C# 14 learning platform designed to take developers from fundamentals to job-ready enterprise competency.",
      "provider": {
        "@type": "Organization",
        "name": "Karmatix",
        "url": "https://karmatix.in"
      },
      "educationalCredentialAwarded": "Certificate of Completion",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "category": "Free Educational Resource"
      }
    }
    </script>

    <!-- Zero-flash Dark Mode Theme Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('karmatix-dotnet:v1:theme');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
