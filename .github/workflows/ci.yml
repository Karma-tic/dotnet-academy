name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  dotnet-samples-pipeline:
    name: Verify .NET 10 Samples & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore samples/KarmatixDotNetAcademy.sln

      - name: Build All Samples with -warnaserror
        run: dotnet build samples/KarmatixDotNetAcademy.sln -c Release -warnaserror --no-restore

      - name: Run All xUnit Tests
        run: dotnet test samples/KarmatixDotNetAcademy.sln -c Release --no-build --verbosity normal

  website-build-and-lint:
    name: Build & Type-Check Web Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Node Dependencies
        run: cd site && npm ci

      - name: Run TypeScript Strict Type Checks
        run: cd site && npm run lint

      - name: Build Static Production Site
        run: cd site && npm run build

      - name: Verify Static Distribution Artifacts
        run: |
          test -f site/dist/index.html || exit 1
          test -f site/dist/sitemap.xml || exit 1
          test -f site/dist/CNAME || exit 1
          echo "Static site distribution successfully verified."

  link-and-accessibility-checks:
    name: Link Checker & Accessibility Gate
    needs: [dotnet-samples-pipeline, website-build-and-lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Dependencies
        run: cd site && npm ci

      - name: Build Website
        run: cd site && npm run build

      - name: Run Local Static Preview Server & Link Checks
        run: |
          npx serve -s site/dist -l 3000 &
          sleep 3
          curl -I http://localhost:3000/ || exit 1
          curl -I http://localhost:3000/sitemap.xml || exit 1
          echo "Preview server responsive on port 3000."
