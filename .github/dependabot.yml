version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for npm (site)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"

  # Maintain dependencies for NuGet (samples)
  - package-ecosystem: "nuget"
    directory: "/samples"
    schedule:
      interval: "weekly"

